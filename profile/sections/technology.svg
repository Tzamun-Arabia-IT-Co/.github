<svg xmlns="http://www.w3.org/2000/svg" width="720" height="88" viewBox="0 0 720 88" role="img" aria-labelledby="title desc">
  <title id="title">Technology stack</title>
  <desc id="desc">Data signals circulate through a processor. Text remains stationary. Animation respects reduced-motion preferences.</desc>
  <defs>
    <linearGradient id="bg"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#101f36"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#25d3b0"/><stop offset="1" stop-color="#4ba3ff"/></linearGradient>
    <style>
      .data{stroke-dasharray:8 48;animation:data 3s linear infinite}@keyframes data{to{stroke-dashoffset:-56}}.core{animation:core 4s ease-in-out infinite}@keyframes core{0%,100%{opacity:.4}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce) { .art * { animation: none !important; } .wave { opacity: .3; } }
    </style>
  </defs>
  <rect x="1" y="1" width="718" height="86" rx="16" fill="url(#bg)" stroke="#234653"/>
  <rect x="24" y="25" width="3" height="38" rx="1.5" fill="url(#accent)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="44" y="55" fill="#6ce2ce" font-size="20" font-weight="600">04</text>
    <text x="86" y="56" fill="#f0f6fc" font-size="30" font-weight="700">Technology stack</text>
  </g>
  <g class="art" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <g opacity=".35"><path d="M570 24h34l16 16m-50 24h34l16-16M660 40l16-16h30m-46 24 16 16h30M633 8v16m14-16v16m-14 40v16m14-16v16"/></g><path class="data" d="M570 24h34l16 16m-50 24h34l16-16M660 40l16-16h30m-46 24 16 16h30" stroke="#4ba3ff" stroke-width="2.5"/><rect x="617" y="21" width="46" height="46" rx="8" fill="#102735"/><rect class="core" x="629" y="33" width="22" height="22" rx="4" fill="#25d3b0" fill-opacity=".2" stroke="#6ce2ce"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="88" viewBox="0 0 720 88" role="img" aria-labelledby="title desc">
  <title id="title">Our platforms</title>
  <desc id="desc">Three floating layers represent connected platforms. Text remains stationary. Animation respects reduced-motion preferences.</desc>
  <defs>
    <linearGradient id="bg"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#0a2930"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#25d3b0"/><stop offset="1" stop-color="#4ba3ff"/></linearGradient>
    <style>
      .layer{animation:float 5s ease-in-out infinite}.middle{animation-delay:-1.6s}.top{animation-delay:-3.2s}@keyframes float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px)}}
      @media (prefers-reduced-motion: reduce) { .art * { animation: none !important; } .wave { opacity: .3; } }
    </style>
  </defs>
  <rect x="1" y="1" width="718" height="86" rx="16" fill="url(#bg)" stroke="#234653"/>
  <rect x="24" y="25" width="3" height="38" rx="1.5" fill="url(#accent)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="44" y="55" fill="#6ce2ce" font-size="20" font-weight="600">03</text>
    <text x="86" y="56" fill="#f0f6fc" font-size="30" font-weight="700">Our platforms</text>
  </g>
  <g class="art" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M574 62h25m84-35h22" opacity=".35"/><path class="layer" d="m640 45 38 17-38 17-38-17z" fill="#102b35"/><path class="layer middle" d="m640 29 38 17-38 17-38-17z" fill="#122f3c"/><path class="layer top" d="m640 13 38 17-38 17-38-17z" fill="#153946"/><path d="M640 24v12m-6-6h12" stroke="#6ce2ce" stroke-width="2"/>
  </g>
</svg>

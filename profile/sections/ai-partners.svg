<svg xmlns="http://www.w3.org/2000/svg" width="720" height="88" viewBox="0 0 720 88" role="img" aria-labelledby="title desc">
  <title id="title">AI partner programs</title>
  <desc id="desc">Two linked nodes exchange traveling pulses along a curved path with an orbiting spark. Text remains stationary. Animation respects reduced-motion preferences.</desc>
  <defs>
    <linearGradient id="bg"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#0f2636"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#25d3b0"/><stop offset="1" stop-color="#4ba3ff"/></linearGradient>
    <style>
      .pulse{stroke-dasharray:20 150;animation:pulse 8s linear infinite}@keyframes pulse{to{stroke-dashoffset:-170}}
      .pulse-rev{stroke-dasharray:14 156;animation:pulse-rev 8s linear infinite}@keyframes pulse-rev{to{stroke-dashoffset:170}}
      .spark{transform-origin:640px 44px;animation:orbit 8s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}
      .glow{animation:glow 4s ease-in-out infinite alternate}@keyframes glow{0%{opacity:.15}100%{opacity:.45}}
      @media (prefers-reduced-motion: reduce) { .art * { animation: none !important; } .wave { opacity: .3; } }
    </style>
  </defs>
  <rect x="1" y="1" width="718" height="86" rx="16" fill="url(#bg)" stroke="#234653"/>
  <rect x="24" y="25" width="3" height="38" rx="1.5" fill="url(#accent)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="44" y="55" fill="#6ce2ce" font-size="20" font-weight="600">04</text>
    <text x="86" y="56" fill="#f0f6fc" font-size="30" font-weight="700">AI partner programs</text>
  </g>
  <g class="art" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M606 44 C622 22, 658 22, 674 44 C658 66, 622 66, 606 44Z" stroke="url(#accent)" stroke-opacity=".25" stroke-width="1.5"/>
    <path class="pulse" d="M606 44 C622 22, 658 22, 674 44 C658 66, 622 66, 606 44Z" stroke="#25d3b0" stroke-width="2.5"/>
    <path class="pulse-rev" d="M674 44 C658 66, 622 66, 606 44 C622 22, 658 22, 674 44Z" stroke="#4ba3ff" stroke-width="2"/>
    <path d="M572 44h20m82 0h20" stroke="#234653" stroke-dasharray="2 4" stroke-width="1.2"/>
    <circle class="glow" cx="606" cy="44" r="18" stroke="#25d3b0" stroke-width="1"/>
    <circle class="glow" cx="674" cy="44" r="18" stroke="#4ba3ff" stroke-width="1"/>
    <circle cx="606" cy="44" r="11" fill="#102735" stroke="url(#accent)" stroke-width="1.8"/>
    <circle cx="606" cy="44" r="4" fill="#25d3b0" stroke="none"/>
    <circle cx="674" cy="44" r="11" fill="#102735" stroke="url(#accent)" stroke-width="1.8"/>
    <circle cx="674" cy="44" r="4" fill="#4ba3ff" stroke="none"/>
    <g class="spark"><circle cx="640" cy="18" r="3" fill="#6ce2ce" stroke="none"/><circle cx="640" cy="18" r="6" fill="#6ce2ce" fill-opacity=".2" stroke="none"/></g>
  </g>
</svg>

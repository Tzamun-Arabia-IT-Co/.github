<svg xmlns="http://www.w3.org/2000/svg" width="720" height="88" viewBox="0 0 720 88" role="img" aria-labelledby="title desc">
  <title id="title">Get in touch</title>
  <desc id="desc">An envelope sends gentle expanding communication signals. Text remains stationary. Animation respects reduced-motion preferences.</desc>
  <defs>
    <linearGradient id="bg"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#0c2b2d"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#25d3b0"/><stop offset="1" stop-color="#4ba3ff"/></linearGradient>
    <style>
      .wave{transform-origin:642px 44px;animation:wave 5s ease-out infinite}.late{animation-delay:-2.5s}@keyframes wave{0%{transform:scale(.7);opacity:0}20%{opacity:.6}100%{transform:scale(1.2);opacity:0}}
      @media (prefers-reduced-motion: reduce) { .art * { animation: none !important; } .wave { opacity: .3; } }
    </style>
  </defs>
  <rect x="1" y="1" width="718" height="86" rx="16" fill="url(#bg)" stroke="#234653"/>
  <rect x="24" y="25" width="3" height="38" rx="1.5" fill="url(#accent)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="44" y="55" fill="#6ce2ce" font-size="20" font-weight="600">06</text>
    <text x="86" y="56" fill="#f0f6fc" font-size="30" font-weight="700">Get in touch</text>
  </g>
  <g class="art" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle class="wave" cx="642" cy="44" r="31"/><circle class="wave late" cx="642" cy="44" r="31"/><rect x="616" y="27" width="52" height="34" rx="5" fill="#102b35"/><path d="m617 29 25 18 25-18m-50 30 17-15m33 15-17-15"/><path d="M578 37h20m-12 13h12m88-13h18m-18 13h10" opacity=".4"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="88" viewBox="0 0 720 88" role="img" aria-labelledby="title desc">
  <title id="title">Technology partners</title>
  <desc id="desc">Interlinked rings and traveling signals represent collaboration. Text remains stationary. Animation respects reduced-motion preferences.</desc>
  <defs>
    <linearGradient id="bg"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#142536"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#25d3b0"/><stop offset="1" stop-color="#4ba3ff"/></linearGradient>
    <style>
      .link{stroke-dasharray:18 112;animation:link 6s linear infinite}.reverse{animation-direction:reverse}@keyframes link{to{stroke-dashoffset:-130}}
      @media (prefers-reduced-motion: reduce) { .art * { animation: none !important; } .wave { opacity: .3; } }
    </style>
  </defs>
  <rect x="1" y="1" width="718" height="86" rx="16" fill="url(#bg)" stroke="#234653"/>
  <rect x="24" y="25" width="3" height="38" rx="1.5" fill="url(#accent)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="44" y="55" fill="#6ce2ce" font-size="20" font-weight="600">05</text>
    <text x="86" y="56" fill="#f0f6fc" font-size="30" font-weight="700">Technology partners</text>
  </g>
  <g class="art" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="622" cy="44" r="25" opacity=".35"/><circle cx="660" cy="44" r="25" opacity=".35"/><circle class="link" cx="622" cy="44" r="25" stroke="#25d3b0" stroke-width="3"/><circle class="link reverse" cx="660" cy="44" r="25" stroke="#4ba3ff" stroke-width="3"/><path d="M568 44h28m90 0h22" opacity=".3"/><path d="m633 44 6 6 12-12" stroke="#6ce2ce" stroke-width="2.5"/>
  </g>
</svg>

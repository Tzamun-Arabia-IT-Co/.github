<svg xmlns="http://www.w3.org/2000/svg" width="720" height="88" viewBox="0 0 720 88" role="img" aria-labelledby="title desc">
  <title id="title">Who we are</title>
  <desc id="desc">A rotating compass represents direction and shared purpose. Text remains stationary. Animation respects reduced-motion preferences.</desc>
  <defs>
    <linearGradient id="bg"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#0b2330"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#25d3b0"/><stop offset="1" stop-color="#4ba3ff"/></linearGradient>
    <style>
      .needle{transform-origin:640px 44px;animation:turn 16s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce) { .art * { animation: none !important; } .wave { opacity: .3; } }
    </style>
  </defs>
  <rect x="1" y="1" width="718" height="86" rx="16" fill="url(#bg)" stroke="#234653"/>
  <rect x="24" y="25" width="3" height="38" rx="1.5" fill="url(#accent)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="44" y="55" fill="#6ce2ce" font-size="20" font-weight="600">01</text>
    <text x="86" y="56" fill="#f0f6fc" font-size="30" font-weight="700">Who we are</text>
  </g>
  <g class="art" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="640" cy="44" r="30" opacity=".35"/><circle cx="640" cy="44" r="22" opacity=".2"/><path d="M640 8v8m0 56v8M604 44h8m56 0h8"/><g class="needle"><path d="m640 20 9 24-9 24-9-24z" fill="#132d3a"/><path d="m640 20 9 24h-18z" fill="#25d3b0" stroke="none"/></g><circle cx="640" cy="44" r="3" fill="#6ce2ce"/>
  </g>
</svg>

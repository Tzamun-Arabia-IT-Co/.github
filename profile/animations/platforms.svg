<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Saudi Arabia's digital future</title>
  <desc id="desc">Enterprise software, sovereign AI, and cloud infrastructure. Teal and blue connection lines gently illuminate around a connected platform motif.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#0a252c"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#25d3b0"/><stop offset="1" stop-color="#4ba3ff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#178c9b" stop-opacity=".22"/><stop offset="1" stop-color="#178c9b" stop-opacity="0"/></radialGradient>
    <style>
      .signal { stroke-dasharray: 32 420; animation: flow 6s ease-in-out infinite; }
      .orbit { transform-origin: 817px 120px; animation: orbit 18s linear infinite; }
      @keyframes flow { from { stroke-dashoffset: 450; opacity: 0; } 20%, 80% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes orbit { from { transform: rotate(0); } to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .signal { animation: none; opacity: 0; } .orbit { animation: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="958" height="238" rx="20" fill="url(#bg)" stroke="#234653"/>
  <ellipse cx="810" cy="120" rx="220" ry="180" fill="url(#glow)"/>
  <path d="M32 1h896" stroke="url(#accent)" stroke-opacity=".65"/>
  <g fill="none" stroke="#2b6575" stroke-width="1.5" opacity=".55">
    <path d="M670 44h48l45 45h54M680 197h42l43-43h52M890 120h70"/>
    <circle cx="817" cy="120" r="82"/><circle cx="817" cy="120" r="60"/>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="2" class="signal">
    <path d="M670 44h48l45 45h54M680 197h42l43-43h52M890 120h70"/>
  </g>
  <g class="orbit" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round">
    <path d="M817 38a82 82 0 0 1 71 41M817 202a82 82 0 0 1-71-41"/>
    <circle cx="888" cy="79" r="4" fill="#4ba3ff" stroke="none"/>
    <circle cx="746" cy="161" r="4" fill="#25d3b0" stroke="none"/>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linejoin="round">
    <path d="m817 84 34 19-34 19-34-19zM783 120l34 19 34-19M783 137l34 19 34-19"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="40" y="49" fill="#6ce2ce" font-size="14" font-weight="600" letter-spacing="2.5">BUILT IN SAUDI ARABIA</text>
    <text x="40" y="98" fill="#f0f6fc" font-size="36" font-weight="700">Engineering the digital future.</text>
    <text x="40" y="134" fill="#adbfce" font-size="19">Purpose-built platforms. Lasting partnerships.</text>
    <g font-size="16" font-weight="600" fill="#d5e8f3">
      <rect x="40" y="167" width="190" height="37" rx="18.5" fill="#132d3a" stroke="#2c5364"/>
      <text x="135" y="191" text-anchor="middle">Enterprise software</text>
      <rect x="242" y="167" width="151" height="37" rx="18.5" fill="#132d3a" stroke="#2c5364"/>
      <text x="317.5" y="191" text-anchor="middle">Sovereign AI</text>
      <rect x="405" y="167" width="205" height="37" rx="18.5" fill="#132d3a" stroke="#2c5364"/>
      <text x="507.5" y="191" text-anchor="middle">Cloud infrastructure</text>
    </g>
  </g>
</svg>

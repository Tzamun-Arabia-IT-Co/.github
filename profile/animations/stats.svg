<svg xmlns="http://www.w3.org/2000/svg" width="720" height="124" viewBox="0 0 720 124" role="img" aria-labelledby="title desc">
  <title id="title">Key metrics</title>
  <desc id="desc">11 digital platforms, 6 OpenAI certifications, 2 AI partner programs, built in Saudi Arabia. Animation respects reduced-motion preferences.</desc>
  <defs>
    <linearGradient id="bg"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#0b2330"/></linearGradient>
    <linearGradient id="tile-bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#102534"/><stop offset="1" stop-color="#0a1a27"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#25d3b0"/><stop offset="1" stop-color="#4ba3ff"/></linearGradient>
    <linearGradient id="sweep-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25d3b0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4ba3ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tiles-clip">
      <rect x="12" y="6" width="165" height="112" rx="14"/>
      <rect x="189" y="6" width="165" height="112" rx="14"/>
      <rect x="366" y="6" width="165" height="112" rx="14"/>
      <rect x="543" y="6" width="165" height="112" rx="14"/>
    </clipPath>
    <style>
      .tile {
        animation: tileIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .t1 { animation-delay: 0.1s; }
      .t2 { animation-delay: 0.22s; }
      .t3 { animation-delay: 0.34s; }
      .t4 { animation-delay: 0.46s; }
      @keyframes tileIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }
      .sweep {
        animation: sweep 8s ease-in-out infinite;
        animation-delay: 1.2s;
      }
      @keyframes sweep {
        0% { transform: translateX(-220px) skewX(-20deg); opacity: 0; }
        2% { opacity: 1; }
        24% { transform: translateX(980px) skewX(-20deg); opacity: 1; }
        25%, 100% { transform: translateX(980px) skewX(-20deg); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .tile { animation: none !important; opacity: 1 !important; transform: none !important; }
        .sweep { display: none !important; }
      }
    </style>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <!-- Tile 1: Digital platforms -->
    <g class="tile t1">
      <rect x="12" y="6" width="165" height="112" rx="14" fill="url(#tile-bg)" stroke="#234653" stroke-width="1.2"/>
      <rect x="59" y="7" width="70" height="2" rx="1" fill="url(#accent)" opacity=".6"/>
      <text x="94.5" y="52" fill="#6ce2ce" font-size="36" font-weight="700">11</text>
      <text x="94.5" y="78" fill="#adbfce" font-size="13" font-weight="500">
        <tspan x="94.5" dy="0">Digital</tspan>
        <tspan x="94.5" dy="17">platforms</tspan>
      </text>
    </g>

    <!-- Tile 2: OpenAI certifications -->
    <g class="tile t2">
      <rect x="189" y="6" width="165" height="112" rx="14" fill="url(#tile-bg)" stroke="#234653" stroke-width="1.2"/>
      <rect x="236" y="7" width="70" height="2" rx="1" fill="url(#accent)" opacity=".6"/>
      <text x="271.5" y="52" fill="#6ce2ce" font-size="36" font-weight="700">6</text>
      <text x="271.5" y="78" fill="#adbfce" font-size="13" font-weight="500">
        <tspan x="271.5" dy="0">OpenAI</tspan>
        <tspan x="271.5" dy="17">certifications</tspan>
      </text>
    </g>

    <!-- Tile 3: AI partner programs -->
    <g class="tile t3">
      <rect x="366" y="6" width="165" height="112" rx="14" fill="url(#tile-bg)" stroke="#234653" stroke-width="1.2"/>
      <rect x="413" y="7" width="70" height="2" rx="1" fill="url(#accent)" opacity=".6"/>
      <text x="448.5" y="52" fill="#6ce2ce" font-size="36" font-weight="700">2</text>
      <text x="448.5" y="78" fill="#adbfce" font-size="13" font-weight="500">
        <tspan x="448.5" dy="0">AI partner</tspan>
        <tspan x="448.5" dy="17">programs</tspan>
      </text>
    </g>

    <!-- Tile 4: Built in Saudi Arabia -->
    <g class="tile t4">
      <rect x="543" y="6" width="165" height="112" rx="14" fill="url(#tile-bg)" stroke="#234653" stroke-width="1.2"/>
      <rect x="590" y="7" width="70" height="2" rx="1" fill="url(#accent)" opacity=".6"/>
      <text x="625.5" y="52" fill="#6ce2ce" font-size="36" font-weight="700">KSA</text>
      <text x="625.5" y="78" fill="#adbfce" font-size="13" font-weight="500">
        <tspan x="625.5" dy="0">Built in</tspan>
        <tspan x="625.5" dy="17">Saudi Arabia</tspan>
      </text>
    </g>
  </g>

  <!-- Soft light sweep across tiles -->
  <g clip-path="url(#tiles-clip)">
    <rect class="sweep" x="0" y="0" width="140" height="124" fill="url(#sweep-grad)"/>
  </g>
</svg>
